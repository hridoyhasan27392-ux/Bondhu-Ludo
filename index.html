<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bondhu Ludo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:18px}
.card{max-width:520px;margin:15px auto;background:#1d293b;padding:20px;border-radius:18px}
h1{color:#ffd166}
input,select,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:10px;font-size:16px}
button{background:#ffd166;color:#172033;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.secondary{background:#34445d;color:white}
#status{color:#8be9fd;white-space:pre-wrap}
#players{line-height:2}
#dice{font-size:60px;margin:12px}
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:18px}
.cell{aspect-ratio:1;border-radius:9px;background:#34445d;display:flex;align-items:center;justify-content:center;font-size:25px}
.red{background:#e74c3c}.green{background:#27ae60}
.yellow{background:#f1c40f;color:#222}.blue{background:#3498db}
.hidden{display:none}
</style>
</head>
<body>
<h1>🎲 Bondhu Ludo</h1>
<p>বন্ধুদের সঙ্গে অনলাইন লুডু</p>

<section class="card" id="lobby">
<h2>খেলায় প্রবেশ করো</h2>
<input id="name" maxlength="20" placeholder="তোমার নাম লিখো">
<label for="limit">কতজন খেলবে?</label>
<select id="limit">
<option value="2">২ জন</option>
<option value="3">৩ জন</option>
<option value="4" selected>৪ জন</option>
</select>
<button id="create">নতুন রুম তৈরি করো</button>
<hr>
<input id="code" maxlength="6" placeholder="রুম কোড লিখো">
<button class="secondary" id="join">রুমে যোগ দাও</button>
<p id="status">Firebase সংযোগ হচ্ছে...</p>
</section>

<section class="card hidden" id="room">
<h2>তোমার রুম</h2>
<p>রুম কোড: <strong id="roomCode"></strong></p>
<button class="secondary" id="copy">রুম কোড কপি করো</button>
<p>খেলোয়াড়:</p>
<div id="players"></div>
<button id="start">খেলা শুরু করো</button>
<button class="secondary" id="leave">রুম ছেড়ে যাও</button>
</section>

<section class="card hidden" id="game">
<h2>🎲 লুডু খেলা</h2>
<p id="turn"></p>
<div id="dice">⚀</div>
<button id="roll">পাশা চালাও</button>
<div id="board"></div>
<p id="gameStatus"></p>
<button class="secondary" id="exitGame">রুম ছেড়ে যাও</button>
</section>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, get, set, update, onValue, remove }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let uid = null;
let roomCode = "";
let roomData = null;
let gameData = null;
let diceValue = 1;
let unsubscribeRoom = null;
let unsubscribeGame = null;

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove("hidden");
const hide = id => $(id).classList.add("hidden");
const say = message => $("status").textContent = message;

signInAnonymously(auth).catch(error => {
  say("লগইন সমস্যা: " + error.message);
});

onAuthStateChanged(auth, user => {
  if (user) {
    uid = user.uid;
    say("সংযোগ হয়েছে। নিজের নাম লিখে রুম তৈরি করো।");
  }
});

function getName() {
  return $("name").value.trim().slice(0,20) || "বন্ধু";
}

function makeCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let result = "";
  for(let i=0;i<6;i++)
    result += chars[Math.floor(Math.random()*chars.length)];
  return result;
}

$("create").onclick = async () => {
  if(!uid) return say("লগইন হচ্ছে, একটু অপেক্ষা করো।");
  try {
    const limit = Number($("limit").value);
    let code = makeCode();
    while((await get(ref(db,"rooms/"+code))).exists())
      code = makeCode();

    const data = {
      hostUid:uid,
      status:"waiting",
      maxPlayers:limit,
      createdAt:Date.now(),
      players:{
        [uid]:{name:getName(),seat:0,joinedAt:Date.now()}
      }
    };
    await set(ref(db,"rooms/"+code),data);
    enterRoom(code);
  } catch(e) {
    say("রুম তৈরি হয়নি: "+e.message);
  }
};

$("join").onclick = async () => {
  if(!uid) return say("লগইন হচ্ছে, অপেক্ষা করো।");
  const code = $("code").value.trim().toUpperCase();
  if(code.length!==6) return say("সঠিক ৬ অক্ষরের রুম কোড লেখো।");
  try {
    const snap = await get(ref(db,"rooms/"+code));
    if(!snap.exists()) return say("এই রুম পাওয়া যায়নি।");
    const room = snap.val();
    if(room.status!=="waiting") return say("এই রুমে খেলা শুরু হয়ে গেছে।");
    const players = room.players || {};
    if(!players[uid] && Object.keys(players).length>=room.maxPlayers)
      return say("রুমটি পূর্ণ হয়ে গেছে।");

    if(!players[uid]) {
      const used = Object.values(players).map(p=>p.seat);
      let seat=0;
      while(used.includes(seat)) seat++;
      await set(ref(db,`rooms/${code}/players/${uid}`),{
        name:getName(),seat,joinedAt:Date.now()
      });
    }
    enterRoom(code);
  } catch(e) {
    say("রুমে ঢোকা যায়নি: "+e.message);
  }
};

function enterRoom(code) {
  roomCode = code;
  $("roomCode").textContent = code;
  $("code").value = "";
  hide("lobby"); show("room");
  if(unsubscribeRoom) unsubscribeRoom();
  unsubscribeRoom = onValue(ref(db,"rooms/"+code),snap=>{
    if(!snap.exists()) {
      say("রুমটি মুছে গেছে।");
      return;
    }
    roomData=snap.val();
    renderRoom();
    if(roomData.status==="playing") {
      hide("room"); show("game");
      watchGame();
    }
  });
}

function renderRoom() {
  if(!roomData) return;
  const players=Object.entries(roomData.players||{})
    .sort((a,b)=>a[1].seat-b[1].seat);
  $("players").innerHTML=players.map(([id,p])=>
    `<div>${escapeHtml(p.name)} ${id===roomData.hostUid?"👑":""}</div>`
  ).join("");
  $("start").disabled=uid!==roomData.hostUid ||
    players.length!==roomData.maxPlayers;
  $("start").textContent=players.length===roomData.maxPlayers
    ?"খেলা শুরু করো":"খেলোয়াড় পূর্ণ হলে শুরু হবে";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

$("copy").onclick=async()=>{
  try {
    await navigator.clipboard.writeText(roomCode);
    $("copy").textContent="কপি হয়েছে!";
  } catch {
    say("রুম কোডটি হাতে কপি করো: "+roomCode);
  }
};

$("start").onclick=async()=>{
  if(!roomData || uid!==roomData.hostUid) return;
  const players=Object.entries(roomData.players||{})
    .sort((a,b)=>a[1].seat-b[1].seat);
  if(players.length!==roomData.maxPlayers)
    return say("সব খেলোয়াড়কে আগে যোগ দিতে হবে।");

  const tokens={};
  players.forEach(([id,p])=>{
    tokens[id]=[0,0,0,0].map(()=>({steps:-1}));
  });
  const game={
    players:players.map(([id,p])=>({
      uid:id,name:p.name,seat:p.seat
    })),
    tokens,
    turn:0,
    dice:0,
    phase:"roll",
    winner:null
  };
  try {
    await update(ref(db,"rooms/"+roomCode),{status:"playing"});
    await set(ref(db,"rooms/"+roomCode+"/game"),game);
  } catch(e) {
    say("খেলা শুরু হয়নি: "+e.message);
  }
};

function watchGame() {
  if(unsubscribeGame) return;
  unsubscribeGame=onValue(ref(db,"rooms/"+roomCode+"/game"),snap=>{
    if(!snap.exists()) return;
    gameData=snap.val();
    renderGame();
  });
}

/* প্রাথমিক পরীক্ষামূলক বোর্ড */
function renderGame() {
  if(!gameData) return;
  const players=gameData.players||[];
  const current=players[gameData.turn];
  $("turn").textContent=gameData.winner
    ? "বিজয়ী: "+gameData.winner
    : "এখন চাল: "+(current?.name||"");
  $("dice").textContent=["","⚀","⚁","⚂","⚃","⚄","⚅"][gameData.dice||1];
  $("roll").disabled=!current || current.uid!==uid ||
    gameData.phase!=="roll" || !!gameData.winner;

  const colors=["red","green","yellow","blue"];
  $("board").innerHTML="";
  for(let i=0;i<25;i++) {
    const cell=document.createElement("div");
    cell.className="cell";
    const here=[];
    players.forEach((p,index)=>{
      (gameData.tokens[p.uid]||[]).forEach((t,j)=>{
        if(t.steps===i) here.push({index,j});
      });
    });
    if(here.length) {
      const piece=here[0];
      cell.classList.add(colors[piece.index%4]);
      cell.textContent="●";
    } else {
      cell.textContent="";
    }
    $("board").appendChild(cell);
  }
  $("gameStatus").textContent=
    "এটি প্রাথমিক অনলাইন ডেমো। পূর্ণ লুডুর পথ ও ঘুঁটি চালানোর নিয়ম পরবর্তী ধাপে যোগ করতে হবে।";
}

$("roll").onclick=async()=>{
  if(!gameData || gameData.phase!=="roll") return;
  const current=gameData.players[gameData.turn];
  if(!current || current.uid!==uid) return;
  diceValue=Math.floor(Math.random()*6)+1;
  gameData.dice=diceValue;
  gameData.phase="move";
  const next=(gameData.turn+1)%gameData.players.length;
  gameData.turn=next;
  gameData.phase="roll";
  try {
    await set(ref(db,"rooms/"+roomCode+"/game"),gameData);
  } catch(e) {
    $("gameStatus").textContent="সমস্যা: "+e.message;
  }
};

async function leaveRoom() {
  if(!roomCode || !uid) return;
  try {
    if(unsubscribeRoom) unsubscribeRoom();
    if(unsubscribeGame) unsubscribeGame();
    unsubscribeRoom=null;
    unsubscribeGame=null;
    const snap=await get(ref(db,"rooms/"+roomCode));
    if(snap.exists()) {
      const room=snap.val();
      if(room.hostUid===uid) {
        await remove(ref(db,"rooms/"+roomCode));
      } else {
        await remove(ref(db,`rooms/${roomCode}/players/${uid}`));
      }
    }
  } catch(e) {
    say("রুম ছাড়ার সমস্যা: "+e.message);
  }
  roomCode="";
  roomData=null;
  gameData=null;
  hide("room"); hide("game"); show("lobby");
  say("রুম ছেড়েছ। নতুন রুম তৈরি করতে পারো।");
}
$("leave").onclick=leaveRoom;
$("exitGame").onclick=leaveRoom;
</script>
</body>
  </html>
